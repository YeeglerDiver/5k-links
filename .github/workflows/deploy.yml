name: Duplicate Template Deployer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Generate 5,000 Random Pages
        run: |
          node -e '
          const fs = require("fs");
          const crypto = require("crypto");

          const template = fs.readFileSync("template.html", "utf8");
          fs.mkdirSync("dist", { recursive: true });

          const TOTAL_PAGES = 5000;
          const chars = "abcdefghijklmnopqrstuvwxyz0123456789";

          // Helper to create a random string of a random length (between min and max)
          function getRandomSlug(minLen = 6, maxLen = 14) {
            const length = Math.floor(Math.random() * (maxLen - minLen + 1)) + minLen;
            let slug = "";
            for (let i = 0; i < length; i++) {
              slug += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return slug;
          }

          // Ensure all slugs are unique using a Set
          const uniqueSlugs = new Set();
          while (uniqueSlugs.size < TOTAL_PAGES) {
            uniqueSlugs.add(getRandomSlug(6, 14));
          }

          let masterLinksHtml = "";

          for (const slug of uniqueSlugs) {
            const folderPath = `dist/${slug}`;
            fs.mkdirSync(folderPath, { recursive: true });

            fs.writeFileSync(`${folderPath}/index.html`, template);

            masterLinksHtml += `<a class="card" href="./${slug}/">${slug}</a>\n`;
          }

          const masterIndexHtml = `<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Directory Index</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                background: #0d1117;
                color: #c9d1d9;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                padding: 40px 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
              }
              header {
                text-align: center;
                margin-bottom: 28px;
                max-width: 600px;
                width: 100%;
              }
              h1 {
                font-size: 28px;
                font-weight: 700;
                color: #f0f6fc;
                margin-bottom: 8px;
              }
              p {
                color: #8b949e;
                font-size: 14px;
                margin-bottom: 20px;
              }
              .search-box {
                width: 100%;
                padding: 12px 18px;
                border-radius: 8px;
                border: 1px solid #30363d;
                background: #161b22;
                color: #f0f6fc;
                font-size: 15px;
                outline: none;
                transition: border-color 0.2s ease, box-shadow 0.2s ease;
              }
              .search-box:focus {
                border-color: #58a6ff;
                box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2);
              }
              .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 10px;
                width: 100%;
                max-width: 1200px;
              }
              .card {
                display: flex;
                align-items: center;
                justify-content: center;
                background: #161b22;
                border: 1px solid #30363d;
                border-radius: 6px;
                padding: 10px;
                color: #58a6ff;
                text-decoration: none;
                font-size: 13px;
                font-family: monospace;
                transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
              }
              .card:hover {
                background: #21262d;
                border-color: #58a6ff;
                color: #79c0ff;
                transform: translateY(-2px);
              }
              .hidden {
                display: none !important;
              }
            </style>
          </head>
          <body>
            <header>
              <h1>Directory Index</h1>
              <p>5,000 Randomized Pages</p>
              <input type="text" id="filter" class="search-box" placeholder="Quick find path..." autocomplete="off" />
            </header>

            <main class="grid" id="link-grid">
              ${masterLinksHtml}
            </main>

            <script>
              const filter = document.getElementById("filter");
              const links = document.querySelectorAll(".card");

              filter.addEventListener("input", (e) => {
                const term = e.target.value.toLowerCase().trim();
                links.forEach(card => {
                  if (card.textContent.toLowerCase().includes(term)) {
                    card.classList.remove("hidden");
                  } else {
                    card.classList.add("hidden");
                  }
                });
              });
            </script>
          </body>
          </html>`;

          fs.writeFileSync("dist/index.html", masterIndexHtml);
          '

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
