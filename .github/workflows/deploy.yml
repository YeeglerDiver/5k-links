name: Duplicate Template Deployer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Generate 5,000 Pages
        run: |
          node -e '
          const fs = require("fs");

          // Read the base template
          const template = fs.readFileSync("template.html", "utf8");

          // Prepare output directory
          fs.mkdirSync("dist", { recursive: true });

          let masterLinksHtml = "";
          const TOTAL_PAGES = 5000;

          // Create site1 through site5000
          for (let i = 1; i <= TOTAL_PAGES; i++) {
            const slug = `site${i}`;
            const folderPath = `dist/${slug}`;
            fs.mkdirSync(folderPath, { recursive: true });

            // Write the exact same template to each folder
            fs.writeFileSync(`${folderPath}/index.html`, template);

            masterLinksHtml += `<li><a href="./${slug}/">${slug}</a></li>\n`;
          }

          // Generate directory index page
          const masterIndexHtml = `<!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>All 5,000 Sites</title>
            <style>
              body { font-family: sans-serif; padding: 30px; }
              ul { column-count: 4; column-gap: 20px; list-style: none; padding: 0; }
              li { margin: 4px 0; }
              a { color: #0366d6; text-decoration: none; font-size: 14px; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h1>Generated Sites (1 to 5,000)</h1>
            <ul>${masterLinksHtml}</ul>
          </body>
          </html>`;

          fs.writeFileSync("dist/index.html", masterIndexHtml);
          '

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
