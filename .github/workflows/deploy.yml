name: Duplicate Template Deployer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Generate and Duplicate 5k Links
        run: |
          node -e '
          const fs = require("fs");
          
          const template = fs.readFileSync("template.html", "utf8");
          fs.mkdirSync("dist", { recursive: true });

          let masterLinksHtml = "";
          const TOTAL = 5000;

          for (let i = 1; i <= TOTAL; i++) {
            const slug = `site${i}`;
            const targetUrl = `https://example.com/target-${i}`; // Change to your destination pattern

            const folderPath = `dist/${slug}`;
            fs.mkdirSync(folderPath, { recursive: true });

            const customizedHtml = template.replace(/__TARGET_URL__/g, targetUrl);
            fs.writeFileSync(`${folderPath}/index.html`, customizedHtml);

            masterLinksHtml += `<li><a href="./${slug}/">${slug}</a></li>\n`;
          }

          const masterIndexHtml = `<!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Link Registry (5,000 Links)</title>
            <style>
              body { font-family: sans-serif; padding: 30px; background: #fafafa; }
              ul { column-count: 4; column-gap: 20px; list-style: none; padding: 0; }
              li { margin: 4px 0; }
              a { color: #0366d6; text-decoration: none; font-size: 14px; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h1>All Generated Mirror Links (5,000)</h1>
            <ul>${masterLinksHtml}</ul>
          </body>
          </html>`;

          fs.writeFileSync("dist/index.html", masterIndexHtml);
          '

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
